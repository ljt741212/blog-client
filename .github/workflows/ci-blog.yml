name: Blog CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/blog/**'
      - 'packages/**'
      - 'Dockerfile.blog'
      - 'deploy/**'
      - '.github/workflows/ci-blog.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter blog lint

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:blog

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login -u ${{ secrets.ACR_USERNAME }} --password-stdin crpi-if0dbq06utqk8du0.cn-hongkong.personal.cr.aliyuncs.com

      - name: Build and push Docker image
        run: |
          docker build -f Dockerfile.blog -t crpi-if0dbq06utqk8du0.cn-hongkong.personal.cr.aliyuncs.com/blog-client/blog:latest .
          docker push crpi-if0dbq06utqk8du0.cn-hongkong.personal.cr.aliyuncs.com/blog-client/blog:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/blog-client
            docker compose pull blog
            docker compose up -d blog
            docker image prune -f
            echo ">>> blog deployed"
