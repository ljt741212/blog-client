name: Admin CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/ci-admin.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin typecheck

  deploy:
    needs: typecheck
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          set -e
          if [ -d /opt/blog-client-repo ]; then
            cd /opt/blog-client-repo
            git fetch origin main
            git reset --hard origin/main
          else
            git clone git@github.com:ljt741212/blog-client.git /opt/blog-client-repo
          fi

      - name: Build admin
        run: |
          set -e
          docker run --rm \
            --memory=1.5g \
            -e NODE_OPTIONS="--max-old-space-size=1024" \
            -v /opt/blog-client-repo:/app \
            -v /opt/blog-client/admin-dist:/output \
            node:22-alpine sh -c "
              corepack enable &&
              corepack prepare pnpm@10.6.3 --activate &&
              cd /app &&
              pnpm install --frozen-lockfile &&
              pnpm build:admin &&
              rm -rf /output/* &&
              cp -r apps/admin/build/client/* /output/
            "

      - name: Sync nginx config
        run: |
          set -e
          cp -f /opt/blog-client-repo/deploy/nginx-blog.conf /etc/nginx/conf.d/blog.conf
          docker run --rm --pid host -v /etc/nginx/conf.d:/etc/nginx/conf.d -v /var/run:/var/run nginx:alpine nginx -t
          docker run --rm --pid host -v /etc/nginx/conf.d:/etc/nginx/conf.d -v /var/run:/var/run nginx:alpine nginx -s reload
          echo ">>> admin deployed successfully"
