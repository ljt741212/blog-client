name: Blog CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/blog/**'
      - 'packages/**'
      - 'Dockerfile.blog'
      - 'deploy/**'
      - '.github/workflows/ci-blog.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/blog/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter blog lint

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          set -e
          if [ -d /opt/blog-client-repo ]; then
            cd /opt/blog-client-repo
            git fetch origin main
            git reset --hard origin/main
          else
            git clone https://github.com/ljt741212/blog-client.git /opt/blog-client-repo
          fi

      - name: Build and deploy blog
        run: |
          set -e
          cd /opt/blog-client-repo

          echo ">>> syncing deploy files..."
          cp -f deploy/docker-compose.yml /opt/blog-client/docker-compose.yml
          cp -f deploy/nginx-blog.conf /etc/nginx/conf.d/blog.conf
          nginx -t && nginx -s reload

          echo ">>> building blog image..."
          docker build -f Dockerfile.blog -t blog-client:latest .

          cd /opt/blog-client

          echo ">>> restarting blog..."
          docker compose up -d --remove-orphans

          echo ">>> cleaning up old images..."
          docker image prune -f

          echo ">>> container status:"
          docker compose ps
